version: "3"

vars:
  JULIA: julia

tasks:
  default:
    deps: [install]

  install:
    desc: Install and instantiate Julia package
    cmds:
      - "{{.JULIA}} -e 'using Pkg; Pkg.develop(PackageSpec(path=pwd()));
        Pkg.instantiate()'"

  test:
    desc: Run Julia package tests
    cmds:
      - "{{.JULIA}} --project=. -e 'using Pkg; Pkg.test()'"

  docs:
    desc: Build documentation
    cmds:
      - "{{.JULIA}} --project=docs/ -e 'using Pkg;
        Pkg.develop(PackageSpec(path=pwd())); Pkg.instantiate()'"
      - "{{.JULIA}} --project=docs/ docs/make.jl"

  paper-preview:
    desc: Preview the paper
    cmds:
      - rm -rf /run/user/1000/julia/Project.toml
      - quarto preview intercepts.qmd

  readme:
    desc: Render the README
    cmds:
      - quarto render README.qmd

  fig:
    desc: "Render one paper figure to PNG + summary table (usage: task fig -- fig-rho-centering)"
    cmds:
      - "{{.JULIA}} --project=. dev/figure.jl {{.CLI_ARGS}}"

  fig-all:
    desc: Render every paper figure to PNG + summary tables
    cmds:
      - "{{.JULIA}} --project=. dev/figure.jl --all"

  paper-render:
    desc: Render the paper
    cmds:
      - quarto render intercepts.qmd
