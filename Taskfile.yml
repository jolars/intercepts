version: "3"

vars:
  JULIA: julia

tasks:
  default:
    deps: [install]

  install:
    desc: Install and instantiate Julia package
    cmds:
      - "{{.JULIA}} -e 'using Pkg; Pkg.develop(PackageSpec(path=pwd()));
        Pkg.instantiate()'"

  test:
    desc: Run Julia package tests
    cmds:
      - "{{.JULIA}} --project=. -e 'using Pkg; Pkg.test()'"

  docs:
    desc: Build documentation
    cmds:
      - "{{.JULIA}} --project=docs/ -e 'using Pkg;
        Pkg.develop(PackageSpec(path=pwd())); Pkg.instantiate()'"
      - "{{.JULIA}} --project=docs/ docs/make.jl"

  paper-preview:
    desc: Preview the paper
    cmds:
      - rm -rf /run/user/1000/julia/Project.toml
      - quarto preview intercepts.qmd

  readme:
    desc: Render the README
    cmds:
      - quarto render README.qmd

  fig:
    desc: "Render one paper figure to PNG + summary table (usage: task fig -- fig-rho-centering)"
    cmds:
      - "{{.JULIA}} --project=. dev/figure.jl {{.CLI_ARGS}}"

  fig-all:
    desc: Render every paper figure to PNG + summary tables
    cmds:
      - "{{.JULIA}} --project=. dev/figure.jl --all"

  paper-render:
    desc: Render the paper
    cmds:
      - quarto render intercepts.qmd

  caches:
    desc: Regenerate the synthetic Julia results caches (may take hours)
    cmds:
      - "{{.JULIA}} --project=. experiments/sim-mu-extreme.jl"
      - "{{.JULIA}} --project=. experiments/sim-irls-comparison.jl"
      - "{{.JULIA}} --project=. experiments/sim-cold-start.jl"
      - "{{.JULIA}} --project=. experiments/sim-cold-start-poisson.jl"
      - "{{.JULIA}} --project=. experiments/sim-mu-reg-heatmap.jl"
      - "{{.JULIA}} --project=. experiments/sim-rate-gap.jl"
      - "{{.JULIA}} --project=. experiments/sim-rho-centering.jl"
      - "{{.JULIA}} --project=. experiments/sim-rho-centering-diagnostics.jl"
      - "{{.JULIA}} --project=. experiments/sim-rho-frozen-hessian.jl"
      - "{{.JULIA}} --project=. experiments/sim-multinomial-imbalance.jl"
      - "{{.JULIA}} --project=. experiments/sim-multinomial-imbalance-sweep.jl"
      - "{{.JULIA}} --project=. experiments/sim-per-pass-cost.jl"

  caches-real:
    desc: Regenerate the real-data Julia caches (requires the staged archive)
    cmds:
      - "{{.JULIA}} --project=. experiments/first-example.jl"
      - "{{.JULIA}} --project=. experiments/sim-first-example-ordering.jl"
      - "{{.JULIA}} --project=. experiments/sim-warmstart-path.jl"
      - "{{.JULIA}} --project=. experiments/sim-real-logreg.jl"
      - "{{.JULIA}} --project=. experiments/sim-real-multinomial-yeoh.jl"
      - "{{.JULIA}} --project=. experiments/sim-real-multinomial-shuttle.jl"
