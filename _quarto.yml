description: >
  How the intercept is updated inside coordinate descent for regularized
  generalized linear models, and why the choice matters under response
  imbalance.
abstract: >
  Coordinate descent solvers for regularized generalized linear models (GLMs)
  differ in how they update the intercept, and this choice can substantially
  affect convergence under response imbalance. For direct coordinate descent
  on the original GLM loss, we compare three strategies: one step using a global
  curvature bound, one Armijo-safeguarded Newton step using local curvature, and
  repeated Newton steps that solve the intercept subproblem. Our analysis shows
  that the global-bound strategy removes only a fraction $H_{00}/L_0$ of the
  intercept--coefficient coupling. In logistic regression, this fraction can
  become small as the response grows more imbalanced, producing a corresponding
  slowdown when a coupled mode controls convergence. A single Newton step avoids
  this attenuation and, in our experiments, follows nearly the same outer
  convergence trajectory as exact minimization while requiring fewer inner
  steps. The same mechanism distinguishes global-majorant IRLS from local-weight
  IRLS and proximal-Newton methods, whose quadratic surrogates already supply
  local curvature. Experiments with simulated and real data, including
  comparisons across six production solvers, weight-scheme comparisons within
  glmnet and biglasso, and an intercept-only intervention within skglm, support
  these predictions. A multinomial extension shows how rare classes create
  low-curvature intercept directions. We therefore recommend a safeguarded
  Newton update for direct coordinate descent and full intercept optimization
  within frozen local quadratic surrogates.

