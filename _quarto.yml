description: >
  How the intercept is updated inside coordinate descent for regularized
  generalized linear models, and why the choice matters under response
  imbalance.
abstract: >
  Coordinate descent solvers for regularized generalized linear models (GLMs)
  disagree on how to update the intercept, and the disagreement matters under
  response imbalance. Three strategies span what these solvers do: a single
  gradient step, a single Newton step (with a backtracking safeguard), or
  solving the one-dimensional intercept subproblem exactly. The gradient step is
  the culprit. It scales every update by a fixed, worst-case constant, and when
  the response is imbalanced, for example when one class is rare, or counts are
  heavily skewed, that constant is far too cautious for the intercept, so it
  barely moves while the other coordinates wait on it. And the slowdown grows as
  the imbalance worsens. A Newton step instead scales the update by the
  curvature at the current iterate, adapting as the imbalance worsens. It
  matches the exact strategy in convergence per iteration and avoids the wasted
  inner iterations that the exact strategy spends. The distinction matters only
  for solvers that run coordinate descent directly on the GLM loss and for the
  global-upper-bound modes that are selectable in some implementations. Solvers
  that reduce each step to a weighted-least-squares problem already get the
  adaptive update for free. Across six production solvers (glmnet, biglasso,
  skglm, adelie, LIBLINEAR, BlitzL1), the predicted ordering holds in our
  experiments. A multinomial extension shows that rare classes turn the
  gradient-strategy slowdown into the common regime. The practical
  recommendation is to update the intercept with a single Newton step.

