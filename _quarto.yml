description: >
  How the intercept is updated inside coordinate descent for regularized
  generalized linear models, and why the choice matters under response
  imbalance.
abstract: >
  Coordinate descent solvers for regularized generalized linear models (GLMs)
  differ in how they update the intercept. This seemingly routine choice can
  substantially affect convergence when the response is imbalanced. For direct
  coordinate descent on the original GLM loss, we compare a conservative step
  based on worst-case curvature, a safeguarded Newton step based on current
  curvature, and repeated Newton steps that solve the intercept subproblem. The
  conservative update can leave much of the interaction between the intercept
  and the coefficients unresolved, producing a slowdown when that interaction
  controls convergence. A single Newton step avoids this attenuation and, in
  our experiments, follows nearly the same outer trajectory as exact
  minimization while requiring fewer inner steps. Simulated and real-data
  experiments, including comparisons across six production solvers and a
  controlled intervention within skglm, support this explanation. We also show
  how the same mechanism appears in quadratic-approximation methods and extends
  to multinomial models with rare classes. We recommend a safeguarded Newton
  update for direct coordinate descent and full intercept optimization within
  frozen local quadratic surrogates.

