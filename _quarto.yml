description: >
  How the intercept is updated inside coordinate descent for regularized
  generalized linear models, and why the choice matters under response
  imbalance.
abstract: >
  Production coordinate descent solvers for regularized generalized linear
  models (GLMs) disagree on how to update the intercept, and the disagreement
  matters under response imbalance. Three strategies span the design space: a
  single gradient step, a single Newton step (with an Armijo safeguard), or
  iterating the intercept subproblem to convergence. The mechanism is a
  mismatch between the per-coordinate Lipschitz constant $L_0$ and the
  iterate-level intercept curvature $H_{00}$: under imbalance $L_0/H_{00}$
  diverges, so the gradient strategy slows by that factor, while the Newton
  strategy tracks the local curvature and matches the convergence strategy up
  to a bounded per-pass overhead. When coordinate descent runs inside an IRLS
  or other quadratic-surrogate inner solve, the three strategies collapse onto
  the same update on the inner quadratic, so the distinction has bite only on
  solvers that run coordinate descent directly on the GLM loss and on the
  global-upper-bound IRLS modes of glmnet and biglasso. Experiments on a
  shared imbalanced logistic problem confirm the predicted ordering across six
  production solvers (glmnet, biglasso, skglm, adelie, LIBLINEAR, BlitzL1),
  and a multinomial extension shows that rare classes turn the
  gradient-strategy slowdown into the common regime. The practical
  recommendation is to update the intercept with a single Newton step.

