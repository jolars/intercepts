description: >
  How the intercept is updated inside coordinate descent for regularized
  generalized linear models, and why the choice matters under response
  imbalance.
abstract: >
  Production coordinate descent solvers for regularized generalized linear
  models (GLMs) disagree on how to update the intercept, and the disagreement
  matters under response imbalance. Three strategies span what these solvers
  do: a single gradient step, a single Newton step (with a backtracking
  safeguard), or solving the one-dimensional intercept subproblem exactly. The
  gradient step is the culprit. It scales every update by a fixed, worst-case
  constant, and when the response is imbalanced---one class rare, or counts
  heavily skewed---that constant is far too cautious for the intercept, so it
  barely moves while the other coordinates wait on it; the slowdown grows as
  the imbalance worsens. A Newton step instead uses the curvature at the
  current iterate, which stays well-scaled however imbalanced the data are. It
  matches the exact strategy pass for pass, and avoids the wasted inner
  iterations that strategy spends. The distinction has bite only for solvers
  that run coordinate descent directly on the GLM loss and for the
  global-upper-bound modes of glmnet and biglasso; solvers that reduce each
  step to a weighted-least-squares problem already get the adaptive update for
  free. Across six production solvers (glmnet, biglasso, skglm, adelie,
  LIBLINEAR, BlitzL1), the predicted ordering holds at the operating points
  tested, establishing the direction of the effect rather than its scaling. The
  scaling claim, that the slowdown grows with imbalance, rests on controlled
  evidence: the within-package mode toggles in glmnet and biglasso, the same
  skglm solver measured before and after a merged intercept-update patch, and
  in-house parameter sweeps. A multinomial extension shows that rare classes
  turn the gradient-strategy slowdown into the common regime. The
  practical recommendation is to update the intercept with a single Newton
  step.

